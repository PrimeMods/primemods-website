name = "primemods-website"
main = "_worker.js"
compatibility_date = "2026-08-04"

[assets]
directory = "./public"
binding = "ASSETS"
# /downloads serves public/downloads/index.html
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# R2 bucket holding the pack part zips. Create it first:
#   npx wrangler r2 bucket create primes-hd-textures
[[r2_buckets]]
binding = "PACKS"
bucket_name = "primes-hd-textures"

# Set these in the dashboard (Settings → Variables and Secrets) or via
#   npx wrangler secret put PATREON_CLIENT_SECRET
#   npx wrangler secret put COOKIE_SECRET
[vars]
PATREON_CLIENT_ID = "Ue5jWqFIGGAg5mR1pytqQ0eijnDahZoNDzg-QGMNQSs6_ABGukv0cWaLzdUcx4eo"
OWNER_IDS = "42536237"
