name = "primemods-website"
main = "_worker.js"
compatibility_date = "2026-08-04"

# Merging a 256x pack with every add-on moves a lot of bytes in one request.
# The 30s default is close to the line; this buys headroom. You are billed for
# CPU actually used, not for the ceiling, so raising it costs nothing on its own.
[limits]
cpu_ms = 300000

[assets]
directory = "./public"
binding = "ASSETS"
# /downloads serves public/downloads/index.html
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# R2 bucket holding the pack part zips. Create it first:
#   npx wrangler r2 bucket create primes-hd-textures
[[r2_buckets]]
binding = "PACKS"
bucket_name = "primes-hd-textures"

# Plain-text variables live HERE, not in the dashboard: a deploy replaces the
# Worker's whole variable set with this block, so anything added by hand in
# Settings → Variables is wiped on the next upload. Secrets set with
# `wrangler secret put` survive deploys — keep them out of this file.
#
# Secrets to set once (they persist):
#   npx wrangler secret put PATREON_CLIENT_SECRET
#   npx wrangler secret put COOKIE_SECRET
[vars]
PATREON_CLIENT_ID = "Ue5jWqFIGGAg5mR1pytqQ0eijnDahZoNDzg-QGMNQSs6_ABGukv0cWaLzdUcx4eo"
# Optional. The creator account is detected automatically from the campaign it
# owns; these are for extra accounts that should always have full access.
OWNER_IDS = ""
TEAM_IDS = "28982945,165344659,135944510,21501443"
