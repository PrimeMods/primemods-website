document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sc-if>\n\n<section id=\"features\" style=\"padding:104px 40px 40px;max-width:1360px;margin:0 auto\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:44px\">\n    <div style=\"display:flex;flex-direction:column;gap:18px;max-width:640px\">\n      <h2 style=\"font:700 clamp(30px,3.2vw,46px)/1.05 Archivo,sans-serif;letter-spacing:-.03em;text-wrap:balance\">Explore the features<\u002Fh2>\n    <\u002Fdiv>\n    \n  <\u002Fdiv>\n\n  \n\n  <div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;padding-bottom:96px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div sc-camel-on-mouse-move=\"{{ onZoom }}\" sc-camel-on-mouse-leave=\"{{ onZoomOut }}\" sc-camel-on-pointer-down=\"{{ onZoomTap }}\" style=\"position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid oklch(.34 .012 65);background:oklch(.22 .012 65);cursor:crosshair\">\n        <div role=\"img\" aria-label=\"The same scene rendered at {{ resLabel }}\" style=\"position:absolute;inset:0;background-image:url({{ previewSrc }});background-size:cover;background-position:center;transform-origin:{{ zoomPos }};transform:{{ zoomTransform }};transition:transform .18s ease-out\"><\u002Fdiv>\n        <div style=\"position:absolute;left:20px;top:18px;font:600 30px/1 Archivo,sans-serif;letter-spacing:-.02em;color:oklch(.96 .004 65);text-shadow:0 2px 14px oklch(.14 .01 65 / .92);pointer-events:none\">{{ resLabel }}<\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:18px;pointer-events:none;opacity:{{ hintOn }};transition:opacity .2s ease;background:linear-gradient(to top,oklch(.14 .01 65 / .72),transparent)\">\n          <span style=\"display:flex;align-items:center;gap:11px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:oklch(.96 .004 65);background:oklch(.16 .01 65 / .72);backdrop-filter:blur(8px);border:1px solid oklch(.96 .004 65 / .22);border-radius:999px;padding:13px 20px\">\n            <span style=\"position:relative;display:inline-block;width:15px;height:15px;border:2px solid oklch(.96 .004 65);border-radius:999px;flex:0 0 auto\"><span style=\"position:absolute;left:12px;top:12px;width:7px;height:2px;background:oklch(.96 .004 65);transform:rotate(45deg);transform-origin:left center\"><\u002Fspan><\u002Fspan>{{ zoomHint }}\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-pointer-down=\"{{ onRes }}\" sc-camel-on-pointer-move=\"{{ onResDrag }}\" style=\"position:relative;height:34px;display:flex;align-items:center;cursor:pointer;touch-action:none\">\n        <div style=\"width:100%;height:2px;background:oklch(.32 .01 65)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;display:flex;justify-content:space-between;pointer-events:none\">\n          <span style=\"width:6px;height:6px;border-radius:999px;background:oklch(.38 .01 65)\"><\u002Fspan>\n          <span style=\"width:6px;height:6px;border-radius:999px;background:oklch(.38 .01 65)\"><\u002Fspan>\n          <span style=\"width:6px;height:6px;border-radius:999px;background:oklch(.38 .01 65)\"><\u002Fspan>\n          <span style=\"width:6px;height:6px;border-radius:999px;background:oklch(.38 .01 65)\"><\u002Fspan>\n          <span style=\"width:6px;height:6px;border-radius:999px;background:oklch(.38 .01 65)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:{{ resPct }};transform:translateX(-50%);width:18px;height:18px;border-radius:999px;background:oklch(.76 .13 62);pointer-events:none\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:oklch(.62 .01 65)\">\n        <span class=\"scp3\" style=\"cursor: pointer;\">16x (vanilla)<\u002Fspan>\n        <span class=\"scp3\" style=\"cursor: pointer;\">32x<\u002Fspan>\n        <span class=\"scp3\" style=\"cursor: pointer;\">64x<\u002Fspan>\n        <span class=\"scp3\" style=\"cursor: pointer;\">128x<\u002Fspan>\n        <span class=\"scp3\" style=\"cursor: pointer;\">256x<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:oklch(.62 .01 65)\">01 — HD TEXTURES<\u002Fspan>\n      <h3 style=\"font:600 clamp(22px,2.1vw,30px)/1.18 Archivo,sans-serif;letter-spacing:-.02em;text-wrap:balance\">Hand-drawn upscales of Minecraft's default textures<\u002Fh3>\n      <p style=\"font:400 15px/1.6 Archivo,sans-serif;color:oklch(.76 .008 65);text-wrap:pretty\">Textures are meticulously redrawn to match the originals with a frankly unhealthy attention to accuracy. All by hand; no AI here.<\u002Fp>\n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:center;padding-bottom:96px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:oklch(.62 .01 65)\">02 — POM<\u002Fspan>\n      <h3 style=\"font:600 clamp(22px,2.1vw,30px)/1.18 Archivo,sans-serif;letter-spacing:-.02em;text-wrap:balance\">3D depth through parallax occlusion<\u002Fh3>\n      <p style=\"font:400 15px/1.6 Archivo,sans-serif;color:oklch(.76 .008 65);text-wrap:pretty\">No more flat cubes. Alongside the upscales, every block gets a proper 3D heightmap through Parallax Occlusion Mapping.<\u002Fp>\n      <p style=\"display: flex; align-items: flex-start; gap: 9px; font: 400 11.5px/1.5 'IBM Plex Mono',monospace; color: #EC9D53\"><span style=\"color: oklch(0.76 0.13 62); flex: 0 0 auto;\">▲<\u002Fspan>This feature requires the Iris mod and a LabPBR supporting shader<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:9px;align-self:flex-start;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:oklch(.72 .01 65);border:1px solid oklch(.32 .01 65);border-radius:999px;padding:7px 12px 7px 9px\"><span style=\"position: relative; display: inline-block; width: 20px; height: 11px; border-radius: 999px; background: oklch(0.76 0.13 62); flex: 0 0 auto;\"><span style=\"position: absolute; top: 1.5px; right: 1.5px; width: 8px; height: 8px; border-radius: 999px; background: oklch(0.17 0.008 65);\"><\u002Fspan><\u002Fspan>TOGGLEABLE IN SHADER SETTINGS<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;aspect-ratio:16/9;border-radius:6px;border:1px solid oklch(.34 .012 65);background:repeating-linear-gradient(135deg,oklch(.28 .014 65) 0 9px,oklch(.24 .012 65) 9px 18px);display:grid;place-items:center;text-align:center;font:400 11px/1.7 'IBM Plex Mono',monospace;color:oklch(.6 .01 65);padding:20px\">▶ LOOP — camera orbits a brick wall,<br>relief pops as the angle shifts<br>[drop clip · 8s]<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;padding-bottom:96px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid oklch(.34 .012 65);background:repeating-linear-gradient(135deg,oklch(.28 .014 65) 0 9px,oklch(.24 .012 65) 9px 18px)\">\n        <div style=\"position:absolute;inset:0;background:radial-gradient(circle 42% at {{ lightPct }} 34%,oklch(.82 .1 62 / .5),transparent 62%)\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:400 11px/1.7 'IBM Plex Mono',monospace;color:oklch(.66 .01 65);padding:20px\">gold · iron · quartz · deepslate<br>[drop PBR still — light rig moves]<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-pointer-down=\"{{ onLight }}\" sc-camel-on-pointer-move=\"{{ onLightDrag }}\" style=\"position:relative;height:34px;display:flex;align-items:center;cursor:pointer;touch-action:none\">\n        <div style=\"width:100%;height:2px;background:oklch(.32 .01 65)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:{{ lightPct }};transform:translateX(-50%);width:18px;height:18px;border-radius:999px;background:oklch(.76 .13 62)\"><\u002Fdiv>\n        <span style=\"position:absolute;right:0;top:-2px;font:400 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:oklch(.62 .01 65)\">MOVE THE LIGHT<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:oklch(.62 .01 65)\">03 — PBR<\u002Fspan>\n      <h3 style=\"font:600 clamp(22px,2.1vw,30px)/1.18 Archivo,sans-serif;letter-spacing:-.02em;text-wrap:balance\">Physically based lighting and reflections<\u002Fh3>\n      <p style=\"font:400 15px/1.6 Archivo,sans-serif;color:oklch(.76 .008 65);text-wrap:pretty\">Every material meets light on its own terms. Metals gleam, stone soaks it up, and a few blocks are fully, unreasonably reflective.<\u002Fp><p style=\"display: flex; align-items: flex-start; gap: 9px; font: 400 11.5px/1.5 'IBM Plex Mono',monospace; color: #EC9D53\"><span style=\"color: oklch(0.76 0.13 62); flex: 0 0 auto;\">▲<\u002Fspan>This feature requires the Iris mod and a LabPBR supporting shader<\u002Fp>\n      \n      <div style=\"display:flex;align-items:center;gap:9px;align-self:flex-start;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:oklch(.72 .01 65);border:1px solid oklch(.32 .01 65);border-radius:999px;padding:7px 12px 7px 9px\"><span style=\"position: relative; display: inline-block; width: 20px; height: 11px; border-radius: 999px; background: oklch(0.76 0.13 62); flex: 0 0 auto;\"><span style=\"position: absolute; top: 1.5px; right: 1.5px; width: 8px; height: 8px; border-radius: 999px; background: oklch(0.17 0.008 65);\"><\u002Fspan><\u002Fspan>TOGGLEABLE IN SHADER SETTINGS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;padding:26px 0 30px;border-top:1px solid oklch(.28 .01 65);margin-bottom:64px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:620px\">\n      <span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;color:oklch(.76 .13 62)\">OPTIONAL<\u002Fspan>\n      <h3 style=\"font:700 clamp(24px,2.4vw,34px)/1.08 Archivo,sans-serif;letter-spacing:-.03em;text-wrap:balance\">Pack add-ons<\u002Fh3>\n    <\u002Fdiv>\n    <p style=\"font:400 14px/1.6 Archivo,sans-serif;color:oklch(.72 .008 65);max-width:40ch;text-wrap:pretty\">Separate packs that layer on top of the base one. Take all three, take none, switch them off whenever — the base pack doesn't mind.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:center;padding-bottom:96px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:oklch(.62 .01 65)\">04 — LUSH FOLIAGE ADD-ON<\u002Fspan>\n      <h3 style=\"font:600 clamp(22px,2.1vw,30px)/1.18 Archivo,sans-serif;letter-spacing:-.02em;text-wrap:balance\">Lush foliage<\u002Fh3>\n      <p style=\"font:400 15px/1.6 Archivo,sans-serif;color:oklch(.76 .008 65);text-wrap:pretty\">Replaces the models of every leaf, grass tuft, flower and shrub with significantly bushier versions. Your builds will need a gardener.<\u002Fp><p style=\"display: flex; align-items: flex-start; gap: 9px; font: 400 11.5px/1.5 'IBM Plex Mono',monospace; color: #EC9D53\"><span style=\"color: oklch(0.76 0.13 62); flex: 0 0 auto;\">▲<\u002Fspan>Some features of this add-on require the Continuity mod<\u002Fp>\n      \n      \n    <\u002Fdiv>\n    <div style=\"position:relative;aspect-ratio:16/9;border-radius:6px;border:1px solid oklch(.34 .012 65);background:repeating-linear-gradient(135deg,oklch(.28 .014 65) 0 9px,oklch(.24 .012 65) 9px 18px);display:grid;place-items:center;text-align:center;font:400 11px/1.7 'IBM Plex Mono',monospace;color:oklch(.6 .01 65);padding:20px\">▶ LOOP — forest canopy in wind<br>[drop clip · 6s]<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;padding-bottom:96px\">\n    <div style=\"position:relative;aspect-ratio:16/9;border-radius:6px;border:1px solid oklch(.34 .012 65);background:repeating-linear-gradient(135deg,oklch(.28 .014 65) 0 9px,oklch(.24 .012 65) 9px 18px);display:grid;place-items:center;text-align:center;font:400 11px/1.7 'IBM Plex Mono',monospace;color:oklch(.6 .01 65);padding:20px\">inventory + hotbar close-up,<br>shine across item slots<br>[drop still]<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <span style=\"font: 500 10.5px / 1 &quot;IBM Plex Mono&quot;, monospace; letter-spacing: 0.2em; color: oklch(0.62 0.01 65);\">05 — PBR ITEMS ADD-ON<\u002Fspan>\n        <span style=\"font: 500 10px / 1 &quot;IBM Plex Mono&quot;, monospace; letter-spacing: 0.16em; color: oklch(0.76 0.13 62); border: 1px solid oklch(0.76 0.13 62 / 0.6); border-radius: 999px; padding: 5px 9px; white-space: nowrap;\">WIP<\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font:600 clamp(22px,2.1vw,30px)/1.18 Archivo,sans-serif;letter-spacing:-.02em;text-wrap:balance\">PBR items<\u002Fh3>\n      <p style=\"font:400 15px/1.6 Archivo,sans-serif;color:oklch(.76 .008 65);text-wrap:pretty\">Brings the same POM and PBR treatment from the blocks to your tools and items, so nothing goes flat when you open a chest.<\u002Fp><p style=\"display: flex; align-items: flex-start; gap: 9px; font: 400 11.5px/1.5 'IBM Plex Mono',monospace; color: #EC9D53\"><span style=\"color: oklch(0.76 0.13 62); flex: 0 0 auto;\ &quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showTiers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { res: 4, light: 62, zoom: null };\n  steps = ['16×', '32×', '64×', '128×', '256×'];\n  shots = ['uploads/resvanilla.webp', 'uploads/res32.webp', 'uploads/res64.webp', 'uploads/res128.webp', 'uploads/res256.webp'];\n  componentDidMount() { this.shots.forEach(src => { const i = new Image(); i.src = src; }); }\n  pct(e, el) {\n    const r = el.getBoundingClientRect();\n    return Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));\n  }\n  renderVals() {\n    const set = (k) => (e) => this.setState({ [k]: this.pct(e, e.currentTarget) });\n    const setIfDown = (k) => (e) => { if (e.buttons) this.setState({ [k]: this.pct(e, e.currentTarget) }); };\n    const snap = (e) => Math.max(0, Math.min(4, Math.round(this.pct(e, e.currentTarget) / 25)));\n    const pick = (i) => () => this.setState({ res: i });\n    return {\n      resLabel: this.steps[this.state.res],\n      previewSrc: this.shots[this.state.res],\n      zoomPos: this.state.zoom || '50% 50%',\n      zoomTransform: this.state.zoom ? 'scale(3)' : 'scale(1)',\n      hintOn: this.state.zoom ? '0' : '1',\n      onZoom: (e) => {\n        const r = e.currentTarget.getBoundingClientRect();\n        const x = ((e.clientX - r.left) / r.width * 100).toFixed(1);\n        const y = ((e.clientY - r.top) / r.height * 100).toFixed(1);\n        this.setState({ zoom: x + '% ' + y + '%' });\n      },\n      onZoomOut: () => this.setState({ zoom: null }),\n      onZoomTap: (e) => {\n        if (e.pointerType !== 'touch') return;\n        if (this.state.zoom) { this.setState({ zoom: null }); return; }\n        const r = e.currentTarget.getBoundingClientRect();\n        const x = ((e.clientX - r.left) / r.width * 100).toFixed(1);\n        const y = ((e.clientY - r.top) / r.height * 100).toFixed(1);\n        this.setState({ zoom: x + '% ' + y + '%' });\n      },\n      zoomHint: this.state.zoom ? 'MOVE TO PAN' : 'HOVER TO ZOOM',\n      resPct: (this.state.res / 4) * 100 + '%',\n      onRes: (e) => this.setState({ res: snap(e) }),\n      onResDrag: (e) => { if (e.buttons) this.setState({ res: snap(e) }); },\n      onRes0: pick(0),\n      onRes1: pick(1),\n      onRes2: pick(2),\n      onRes3: pick(3),\n      onRes4: pick(4),\n      lightPct: this.state.light.toFixed(1) + '%',\n      onLight: set('light'),\n      onLightDrag: setIfDown('light'),\n      showSpecStrip: this.props.showSpecStrip ?? true,\n      showTiers: this.props.showTiers ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
