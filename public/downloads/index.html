>\n        <p style=\"margin:0;font:400 13.5px/1.6 Archivo,sans-serif;color:oklch(.86 .006 65);text-wrap:pretty\">The pack's 3D depth and lighting&nbsp; effects will NOT work until you have done the following:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:flex-start;gap:13px\">\n            <span style=\"flex:0 0 auto;font:500 11px/1.5 'IBM Plex Mono',monospace;color:oklch(.76 .13 62)\">01<\u002Fspan>\n            <span style=\"font:400 13.5px/1.5 Archivo,sans-serif;color:oklch(.9 .006 65);text-wrap:pretty\">Install <a href=\"https://modrinth.com/mod/iris\" target=\"_blank\" rel=\"noopener\" style=\"border-bottom:1px solid oklch(.76 .13 62 / .5)\">Iris<\u002Fa> and <a href=\"https://modrinth.com/shader/bsl-shaders\" target=\"_blank\" rel=\"noopener\" style=\"border-bottom:1px solid oklch(.76 .13 62 / .5)\">BSL Shaders<\u002Fa>, then enable BSL.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:13px\">\n            <span style=\"flex:0 0 auto;font:500 11px/1.5 'IBM Plex Mono',monospace;color:oklch(.76 .13 62)\">02<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:9px;min-width:0\">\n              <span style=\"font:400 13.5px/1.5 Archivo,sans-serif;color:oklch(.9 .006 65);text-wrap:pretty\">In BSL's shader settings, turn Advanced Materials: ON (Located in Shader Settings&nbsp;<span style=\"color: oklch(0.84 0.008 65); font-size: 14px; background-color: oklch(0.195 0.01 65);\">→ Materials)<\u002Fspan><\u002Fspan>\n              \n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font:400 11.5px/1.6 'IBM Plex Mono',monospace;color:oklch(.7 .01 65);text-wrap:pretty\">Any LabPBR-compatible shader will technically work, but the pack has been specifically designed for BSL; results when using other shaders may vary. The PBR Items add-on will ONLY work with BSL.<\u002Fp>\n 332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n  <\u002Fdiv>\n  <span data-fnote=\"\" style=\"margin-left:auto;font:400 11px/1.5 'IBM Plex Mono',monospace;letter-spacing:.1em;color:oklch(.58 .01 65);text-align:right\">Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.<\u002Fspan>\n<\u002Ffooter>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;authState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Logged out&quot;,&quot;Supporter&quot;,&quot;Pack Tester&quot;,&quot;Development Council&quot;,&quot;Team Member&quot;,&quot;Creator&quot;],&quot;default&quot;:&quot;Logged out&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Patreon state&quot;,&quot;label&quot;:&quot;Signed-in as&quot;},&quot;bedrockEta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;COMING SOON&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;,&quot;label&quot;:&quot;Bedrock badge&quot;}}\">\nconst ACCENT = 'oklch(.76 .13 62)';\nconst JOIN_URL = 'https://www.patreon.com/primemods/membership';\n// Patreon red — used for every tier / access cue so gating reads as one system.\nconst PAT_TEXT = 'oklch(.74 .18 22)';\nconst PAT_DIM = 'oklch(.46 .1 22)';\nconst TIER_LADDER = ['Free', 'Supporter', 'Pack Tester', 'Development Council'];\n// Creator and Team Member clear every gate but sit outside the public ladder —\n// they only appear on it when that's who is signed in.\nconst ROLES = ['Supporter', 'Pack Tester', 'Development Council', 'Team Member', 'Creator'];\nconst EARLY_ROLES = ['Pack Tester', 'Development Council', 'Team Member', 'Creator'];\nconst PATREON = '#FF424D';\n\n// Patreon tier IDs — Supporter, Pack Tester, Development Council, and one\n// deprecated tier that still has an active member. All paid tiers reach this\n// page; only Pack Tester and Development Council unlock early access.\nconst TIERS = {\n  supporter:  '5962086',\n  packTester: '9234196',\n  devCouncil: '6201011',\n  legacy:     '5960935'\n};\nconst EARLY_ACCESS_TIERS = [TIERS.packTester, TIERS.devCouncil];\nconst RES = [\n  {label:'32×', px:32, cost:1, costLabel:'Runs on anything'},\n  {label:'64×', px:64, cost:2, costLabel:'Comfortable'},\n  {label:'128×', px:128, cost:3, costLabel:'Demanding'},\n  {label:'256×', px:256, cost:4, costLabel:'Very demanding'}\n];\nconst ADDONS = [\n  {name:'Lush Foliage', slug:'lush-foliage', wip:false, img:'uploads/lushfoliageon.webp', imgOff:'uploads/lushfoliageoff.webp', blurb:'Bushier leaves, grass, flowers and more.'},\n  {name:'PBR Items', slug:'pbr-items', wip:true, img:'uploads/pbr-items-on.webp', imgOff:'uploads/pbr-items-off.webp', blurb:'POM and PBR on tools and items.'},\n  {name:'Block Overlays', slug:'block-overlays', wip:true, img:'uploads/blockoverlayson.webp', imgOff:'uploads/blockoverlaysoff.webp', blurb:'Smooth transitions between different block types.'}\n];\n\n// The two selectable builds. \"Preview\" is the early-access layer, which is\n// still merged on top of the stable base — patrons just pick a build, not a\n// combination.\nconst BUILDS = [\n  {name:'Update 55', tag:'LATEST', early:false,\n   img:'uploads/thumb-update-55.webp',\n   link:'https://www.patreon.com/primemods/posts/out-now-ore-165498859',\n   bullets:[],\n   blurb:'The latest public release. Includes all completed and polished textures & features.'},\n  {name:'Update 56  - Preview 1', tag:'SOON', early:true, soon:true,\n   img:'uploads/thumb-update-55-1-preview.webp',\n   link:false,\n   bullets:[],\n   blurb:'An early preview of the next update. Includes work-in-progress textures & features that may change before release.'}\n];\n\nconst SESSION_KEY = 'phdt.session';\n// The header renders from this cache on first paint, so navigating between pages\n// no longer flashes the logged-out state while /api/patreon/me is in flight.\nfunction readSession() {\n  try { const v = sessionStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; }\n}\nfunction writeSession(s) {\n  try { s ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)) : sessionStorage.removeItem(SESSION_KEY); } catch (e) {}\n}\n\nclass Component extends DCLogic {\n  state = { res: 2, addons: {0:false, 1:false, 2:false}, early: false, building: false, menu: false,\n            session: readSession(), sessionLoaded: false, dlError: '', zoom: null,\n            sizeBytes: null, sizeState: 'idle', done: false, nudge: null, resTouched: false, railPos: 'fits',\n            narrow: typeof matchMedia !== 'undefined' && matchMedia('(max-width:760px)').matches,\n            coarse: typeof matchMedia !== 'undefined' && matchMedia('(pointer:coarse)').matches };\n\n  // Narrow screens get the 900px-wide variants in uploads/m/; desktop is untouched.\n  m(src) { return this.state.narrow ? src.replace('uploads/', 'uploads/m/') : src; }\n  // Narrow screens get a 1:1 detail crop of the resolution shots instead of the\n  // whole frame — at phone width the full frame is too small to read a difference.\n  c(src) { return this.state.narrow ? src.replace('uploads/', 'uploads/c/') : src; }\n  shots = ['uploads/res-select-32.webp', 'uploads/res-select-64.webp', 'uploads/res-select-128.webp', 'uploads/res-select-256.webp'];\n\n  componentDidMount() {\n    this.loadSession();\n    const mq = matchMedia('(max-width:760px)');\n    this._onMq = e => this.setState({ narrow: e.matches });\n    mq.addEventListener('change', this._onMq);\n    this._mq = mq;\n    this._warmed = new Set();\n    // Warm every image a control can reveal — downloaded AND decoded, so the\n    // resolution slider and the add-on toggles never flash on first use.\n    const sweep = () => {\n      const list = [...this.shots, ...this.shots.map(s => this.c(s))];\n      ADDONS.forEach(a => { if (a.img) list.push(a.img); if (a.imgOff) list.push(a.imgOff); });\n      this.warm(list);\n    };\n    if (document.readyState === 'complete') setTimeout(sweep, 400);\n    else addEventListener('load', () => setTimeout(sweep, 400), {once: true});\n    this.navSetup();\n    this.refreshSize();\n    this._onResize = () => this.measureRail();\n    window.addEventListener('resize', this._onResize);\n    this.measureRail();\n  }\n  componentDidUpdate() { this.refreshSize(); this.measureRail(); }\n\n  // Decode, not just download: an image that has arrived but not been decoded\n  // still hitches the first time a control reveals it.\n  warm(list) {\n    if (!list) return;\n    for (const src of list) {\n      if (!src || this._warmed.has(src)) continue;\n      this._warmed.add(src);\n      const i = new Image();\n      i.src = src;\n      if (i.decode) i.decode().catch(() => {});\n    }\n  }\n\n  /* Page changes: hold the current page, run a progress bar, and only swap once\n     the next document has arrived. Avoids the blank frame and unpack splash. */\n  _setBar = el => { this._bar = el; };\n  navSetup() {\n    const bar = this._bar;\n    let arriving = false;\n    try { arriving = sessionStorage.getItem('pm-nav') === '1'; sessionStorage.removeItem('pm-nav'); } catch (e) {}\n    if (arriving && bar) {\n      bar.style.transition = 'none';\n      bar.style.opacity = '1';\n      bar.style.width = '84%';\n      requestAnimationFrame(() => {\n        bar.style.transition = 'width .4s ease, opacity .3s ease .3s';\n        bar.style.width = '100%';\n        bar.style.opacity = '0';\n      });\n    }\n    this._onNavClick = e => {\n      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;\n      const a = e.target && e.target.closest && e.target.closest('a');\n      if (!a || a.target === '_blank' || a.hasAttribute('download')) return;\n      const href = a.getAttribute('href');\n      if (!href || href.charAt(0) === '#') return;\n      let url;\n      try { url = new URL(a.href, location.href); } catch (x) { return; }\n      if (url.origin !== location.origin) return;\n      if (url.pathname.indexOf('/api/') === 0) return;   // Patreon and downloads go native\n      if (url.pathname === location.pathname) return;\n      e.preventDefault();\n      this.goTo(url.href);\n    };\n    document.addEventListener('click', this._onNavClick);\n  }\n  goTo(href) {\n    if (this._leaving) return;\n    this._leaving = true;\n    const bar = this._bar;\n    let pct = 8;\n    if (bar) {\n      bar.style.transition = 'width .3s ease,opacity .25s ease';\n      bar.style.opacity = '1';\n      bar.style.width = pct + '%';\n      this._creep = setInterval(() => {\n        pct += (93 - pct) * 0.16;\n        bar.style.width = pct.toFixed(1) + '%';\n      }, 200);\n    }\n    const go = () => {\n      clearInterval(this._creep);\n      clearTimeout(this._bail);\n      try { sessionStorage.setItem('pm-nav', '1'); } catch (e) {}\n      location.href = href;\n    };\n    this._bail = setTimeout(go, 5000);\n    fetch(href, {credentials: 'same-origin'}).then(r => r.text()).then(go, go);\n  }\n\n  // The download rail follows the page, but only while it actually fits —\n  // pinning a column taller than the viewport just hides its bottom.\n  measureRail() {\n    const el = this._rail;\n    if (!el) return;\n    const next = el.scrollHeight + 108 <= window.innerHeight ? 'fits' : 'tall';\n    if (next !== this.state.railPos) this.setState({railPos: next});\n  }\n  componentWillUnmount() { if (this._mq) this._mq.removeEventListener('change', this._onMq); if (this._onNavClick) document.removeEventListener('click', this._onNavClick); clearInterval(this._creep); clearTimeout(this._bail); window.removeEventListener('resize', this._onResize); clearTimeout(this._dlTimer); clearTimeout(this._sizeTimer); clearTimeout(this._nudgeTimer); }\n\n  // Clicking something locked should say why, not sit there doing nothing.\n  nudge(which) {\n    clearTimeout(this._nudgeTimer);\n    this.setState({nudge: which});\n    this._nudgeTimer = setTimeout(() => this.setState({nudge: null}), 6000);\n  }\n\n  // The download preflight already reports the exact merged size, so the card\n  // shows the real number rather than an estimate. Debounced, and cached per\n  // configuration so dragging the slider doesn't hammer the Worker.\n  refreshSize() {\n    if (this.isBlocked()) { this._sizeKey = 'blocked'; if (this.state.sizeState !== 'idle') this.setState({sizeBytes: null, sizeState: 'idle'}); return; }\n    const key = this.buildQuery().toString();\n    if (key === this._sizeKey) return;\n    this._sizeKey = key;\n    this._sizeCache = this._sizeCache || {};\n    clearTimeout(this._sizeTimer);\n    if (key in this._sizeCache) {\n      this.setState({sizeBytes: this._sizeCache[key], sizeState: 'ready', done: false});\n      return;\n    }\n    this.setState({sizeBytes: null, sizeState: 'loading', done: false});\n    this._sizeTimer = setTimeout(async () => {\n      let bytes = null;\n      try {\n        const r = await fetch('/api/download?' + key + '&check=1', {credentials: 'same-origin'});\n        const j = await r.json();\n        if (j.ok && typeof j.bytes === 'number') bytes = j.bytes;\n      } catch (e) { /* offline / preview */ }\n      this._sizeCache[key] = bytes;\n      if (this._sizeKey === key) this.setState({sizeBytes: bytes, sizeState: bytes == null ? 'unknown' : 'ready'});\n    }, 450);\n  }\n\n  // Reads the signed phdt cookie through the Worker. A non-JSON or failed\n  // response means we're previewing outside the deployed site — fall back to\n  // the authState prop so the design stays inspectable.\n  async loadSession() {\n    let session = null, answered = false;\n    try {\n      const r = await fetch('/api/patreon/me', {credentials: 'same-origin'});\n      if (r.ok) {\n        const j = await r.json();\n        if (typeof j.signedIn === 'boolean') { session = j; answered = true; }\n      }\n    } catch (e) { /* offline / preview */ }\n    // A failed fetch must not wipe the cached session — that is what caused the\n    // logged-out flash on navigation.\n    if (!answered && this.state.session) { this.setState({sessionLoaded: true}); return; }\n    writeSession(session && session.signedIn ? session : null);\n    this.setState({session, sessionLoaded: true});\n  }\n\n  // Resolves live session first, then the Tweaks prop.\n  auth() {\n    const s = this.state.session;\n    if (s && s.signedIn) {\n      if (s.owner) return 'Creator';\n      if (s.team) return 'Team Member';\n      if (ROLES.indexOf(s.tier) !== -1) return s.tier;\n      return s.early ? 'Pack Tester' : 'Supporter';\n    }\n    if (s) return 'Logged out';\n    return this.props.authState || 'Logged out';\n  }\n\n  // Free visitors land on the free build: 128× is the default only once an\n  // account is known to be entitled to it, or once the visitor moves the slider\n  // themselves. Everything above 32× stays selectable either way.\n  effRes() {\n    if (this.state.resTouched) return this.state.res;\n    return this.auth() === 'Logged out' ? 0 : this.state.res;\n  }\n\n  // Mirrors the entitlement check in renderVals, for the size preflight.\n  isBlocked() {\n    const a = this.auth();\n    if (this.state.early && EARLY_ROLES.indexOf(a) === -1) return true;\n    if (a !== 'Logged out') return false;\n    return this.effRes() > 0 || ADDONS.some((_, i) => this.state.addons[i]);\n  }\n\n  buildQuery() {\n    const addons = ADDONS.map((a, i) => this.state.addons[i] ? a.slug : null).filter(Boolean);\n    const q = new URLSearchParams({res: String(RES[this.effRes()].px)});\n    if (addons.length) q.set('addons', addons.join(','));\n    if (this.state.early) q.set('early', '1');\n    return q;\n  }\n\n  async startDownload() {\n    if (this.state.building) return;\n    this.setState({building: true, dlError: ''});\n    const q = this.buildQuery();\n\n    // Preflight: entitlement and missing-file errors come back as JS
